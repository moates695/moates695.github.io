<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- The app's own two washes: peach from the top left, rose from the top
         right, over the warm cream ground. -->
    <radialGradient id="eventpicker_peach" cx="0.12" cy="-0.12" r="0.9">
      <stop stop-color="#ffba94" stop-opacity="0.75"/>
      <stop offset="0.62" stop-color="#ffba94" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eventpicker_rose" cx="0.96" cy="-0.04" r="0.8">
      <stop stop-color="#ffa8ba" stop-opacity="0.65"/>
      <stop offset="0.6" stop-color="#ffa8ba" stop-opacity="0"/>
    </radialGradient>
    <filter id="eventpicker_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#784632" flood-opacity="0.14"/>
    </filter>
  </defs>
  <!-- Palette lifted from the app itself: bg #fff8f3, surface #ffffff,
       line #f4e3d9, accent #ef7d63, accent-deep #ad4129. -->
  <rect width="1024" height="1024" rx="228" fill="#fff8f3"/>
  <rect width="1024" height="1024" rx="228" fill="url(#eventpicker_peach)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#eventpicker_rose)"/>
  <!-- The page itself: one card holding a short question line and three
       options, the middle one picked. -->
  <g filter="url(#eventpicker_shadow)">
    <rect x="212" y="150" width="600" height="724" rx="76" fill="#ffffff"/>
    <rect x="212" y="150" width="600" height="724" rx="76" fill="none" stroke="#eed7c6" stroke-width="22"/>
  </g>
  <rect x="292" y="248" width="284" height="46" rx="23" fill="#ad4129" opacity="0.7"/>
  <!-- Line and tag colours pushed a shade deeper than the app's own, which are
       tuned for a full-size page and vanish at avatar size. -->
  <g fill="#fdf1e7" stroke="#e8c8b2" stroke-width="20">
    <rect x="292" y="366" width="440" height="102" rx="51"/>
    <rect x="292" y="656" width="440" height="102" rx="51"/>
  </g>
  <rect x="292" y="511" width="440" height="102" rx="51" fill="#ef7d63"/>
</svg>
