<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" rx="228" fill="#ffffff"/>
  <!-- Three candles on white, red down then two green up. Only three so the
       bodies stay wide enough to read at avatar size, and flat rather than lit,
       since a glow does nothing on a white ground. -->
  <g stroke-linecap="round">
    <g fill="#dc2626">
      <rect x="264" y="452" width="26" height="360" rx="13"/>
      <rect x="209" y="524" width="136" height="216" rx="20"/>
    </g>
    <g fill="#16a34a">
      <rect x="454" y="336" width="26" height="440" rx="13"/>
      <rect x="399" y="404" width="136" height="216" rx="20"/>
      <rect x="734" y="196" width="26" height="440" rx="13"/>
      <rect x="679" y="264" width="136" height="216" rx="20"/>
    </g>
  </g>
</svg>
